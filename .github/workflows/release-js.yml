name: Release (npm)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-js
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - id: version
        name: Read the version and ask npm whether it is new
        run: |
          version="$(node -p "require('./packages/js/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "commentless@$version" version --silent > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::commentless@$version is already on npm — nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::commentless@$version is new — publishing."
          fi

      - if: steps.version.outputs.published == 'false'
        run: bun install --frozen-lockfile

      - if: steps.version.outputs.published == 'false'
        run: bun run --cwd packages/js lint

      - if: steps.version.outputs.published == 'false'
        run: bun run format

      - if: steps.version.outputs.published == 'false'
        run: bun run --cwd packages/js typecheck

      - if: steps.version.outputs.published == 'false'
        run: bun run --cwd packages/js build

      - if: steps.version.outputs.published == 'false'
        run: bun run --cwd packages/js test

      - if: steps.version.outputs.published == 'false'
        name: Run the CLI against its own source
        run: bun run --cwd packages/js selfcheck

      - if: steps.version.outputs.published == 'false'
        name: Check the CLI reports the version it is about to publish
        run: |
          reported="$(node packages/js/dist/bin.js --version)"
          if [ "$reported" != "${{ steps.version.outputs.version }}" ]; then
            echo "src/version.ts reports $reported but package.json says ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - if: steps.version.outputs.published == 'false'
        working-directory: packages/js
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.version.outputs.published == 'false'
        name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "commentless (npm) v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
